[build]
# CRITICAL: Explicitly tell Railway to use Dockerfile, not auto-detect Node.js
builder = "DOCKERFILE"

[deploy]
# Dockerfile CMD will be used: sh -c "uvicorn app.main:sio_app --host 0.0.0.0 --port ${PORT:-8000}"
# Do NOT override with startCommand - it breaks PORT env expansion
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3