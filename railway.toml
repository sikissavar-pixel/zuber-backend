[build]
builder = "NIXPACKS"

[deploy]
# Use FastAPI backend with uvicorn (app.main:sio_app is the ASGI app with Socket.IO)
startCommand = "uvicorn app.main:sio_app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3